name: 🚀 개발 서버 배포

on:
  pull_request:
    types: [ closed ]
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DB_ENDPOINT: ${{ secrets.DEV_DB_ENDPOINT }}
      DB_NAME: ${{ secrets.DEV_DB_NAME }}
      DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: 🔨 JDK 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔨 gradlew 실행 권한 설정
        run: chmod +x gradlew

      - name: 🔨 Gradle 캐시 설정
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Gradle 빌드
        run: ./gradlew build --parallel

      - name: 📦 배포 파일 준비
        run: |
          mkdir -p before-deploy
          cp ./build/libs/*.jar ./before-deploy/
          cp -r ./scripts/dev/ ./before-deploy/scripts/
          zip -r deploy.zip before-deploy/

      - name: 📤 EC2에 파일 업로드
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.zip"
          target: "/home/ubuntu"

      - name: 🚀 EC2에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            unzip -o /home/ubuntu/deploy.zip -d /home/ubuntu
            rm -rf /home/ubuntu/app/*
            mv /home/ubuntu/before-deploy/* /home/ubuntu/app/

            echo "🛑 기존 WAS 종료 시도"
            PID=$(pgrep -f 'java.*.jar')
            if [ -n "$PID" ]; then
              kill -15 "$PID"
                sleep 5
            fi

            echo "🚀 새 WAS 실행"
            nohup java -jar /home/ubuntu/app/*.jar > /home/ubuntu/app/nohup.out 2>&1 &

            echo "🩺 Health Check 시작..."
            for i in {1..5}
            do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health-check)
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "✅ Health Check 성공 (200 OK)"
                exit 0
              fi
              echo "⏳ 서버 준비 대기 중... 재시도 ($i/5)"
              sleep 10
            done

            echo "❌ Health Check 실패"
            exit 1
            
            rm -rf /home/ubuntu/deploy.zip /home/ubuntu/before-deploy